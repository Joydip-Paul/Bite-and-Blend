<section class="category-section">
  <div class="container">
    <div class="category-carousel">
      @if (showNavigation) {
        <button
          class="carousel-button carousel-button--left"
          type="button"
          aria-label="Show previous categories"
          [disabled]="!canScrollLeft"
          (click)="scroll('left')">
          <span aria-hidden="true">&#10094;</span>
        </button>
      }

      <div
        #categoryList
        class="category-list"
        (scroll)="updateNavigation()">
        @for (category of categories; track category.name) {
          <button
            type="button"
            class="category-card"
            [class.category-card--active]="selectedCategory === category.slug"
            [attr.aria-pressed]="selectedCategory === category.slug"
            (click)="toggleCategory(category.slug)">
            <div class="category-image">
              <img [src]="category.image" [alt]="category.name">
            </div>
            <div class="category-copy"><h3>{{ category.name }}</h3><span>{{ category.count }} items</span></div>
            <i aria-hidden="true">→</i>
          </button>
        }
      </div>

      @if (showNavigation) {
        <button
          class="carousel-button carousel-button--right"
          type="button"
          aria-label="Show next categories"
          [disabled]="!canScrollRight"
          (click)="scroll('right')">
          <span aria-hidden="true">&#10095;</span>
        </button>
      }
    </div>
  </div>
</section>
