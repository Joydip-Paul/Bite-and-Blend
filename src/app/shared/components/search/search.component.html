<div class="search-box">
  <input
    type="text"
    placeholder="Search food & drinks..."
    aria-label="Search products"
    autocomplete="off"
    [(ngModel)]="searchText"
    (ngModelChange)="onSearchChange()"
    (keyup.enter)="searchProduct()"
  />

  @if (searchText) {
    <button class="clear-button" type="button" aria-label="Clear search" (click)="clearSearch()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.3 5.7a1 1 0 00-1.4 0L12 10.6 7.1 5.7a1 1 0 00-1.4 1.4l4.9 4.9-4.9 4.9a1 1 0 101.4 1.4l4.9-4.9 4.9 4.9a1 1 0 001.4-1.4L13.4 12l4.9-4.9a1 1 0 000-1.4z"/>
      </svg>
    </button>
  }

  <button class="search-button" type="button" aria-label="Search" (click)="searchProduct()">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M10 2a8 8 0 105.29 14l5.35 5.35 1.42-1.42-5.35-5.35A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
    </svg>
  </button>
</div>
